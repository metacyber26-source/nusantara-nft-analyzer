<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analisis Filosofi & Fengshui Gambar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4">
  <div class="max-w-4xl mx-auto">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold text-amber-400">Nusantara AI - Fengshui & Filosofi Visual</h1>
      <p class="text-slate-400 mt-2">Unggah gambar untuk menganalisis bentuk, motif, dan warna secara obyektif.</p>
    </header>

    <!-- Upload Box -->
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 mb-8">
      <input type="file" id="imageInput" accept="image/*" class="block w-full text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-amber-500 file:text-slate-900 hover:file:bg-amber-400 cursor-pointer">
      <button onclick="uploadImage()" id="btnSubmit" class="mt-4 w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-2 px-4 rounded-lg transition">Analisis Gambar</button>
    </div>

    <!-- Status Loading -->
    <div id="loading" class="hidden text-center py-6 text-amber-400 font-semibold animate-pulse">
      Menganalisis elemen visual, filosofi, dan Fengshui...
    </div>

    <!-- Container Hasil -->
    <div id="resultContainer" class="hidden space-y-6">
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
        <h2 class="text-xl font-bold text-amber-400 mb-2">Deskripsi Umum Visual</h2>
        <p id="visualDesc" class="text-slate-300"></p>
      </div>

      <div id="elementsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>
  </div>

  <script>
    async function uploadImage() {
      const fileInput = document.getElementById('imageInput');
      if (!fileInput.files[0]) return alert('Silakan pilih gambar terlebih dahulu');

      const file = fileInput.files[0];
      const reader = new FileReader();

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('resultContainer').classList.add('hidden');

      reader.onload = async function(e) {
        const base64Data = e.target.result.split(',')[1];
        
        try {
          const res = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              imageBase64: base64Data,
              mimeType: file.type
            })
          });

          const data = await res.json();
          document.getElementById('loading').classList.add('hidden');

          if (res.ok) {
            displayResults(data);
          } else {
            alert('Error: ' + data.error);
          }
        } catch (err) {
          document.getElementById('loading').classList.add('hidden');
          alert('Terjadi kesalahan koneksi.');
        }
      };

      reader.readAsDataURL(file);
    }

    function displayResults(data) {
      document.getElementById('visualDesc').innerText = data.visualDescription;
      const grid = document.getElementById('elementsGrid');
      grid.innerHTML = '';

      data.elementsAnalysis.forEach(item => {
        const card = `
          <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-3">
            <span class="inline-block bg-amber-500/20 text-amber-400 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">${item.part}</span>
            <div class="text-xs text-slate-400 space-y-1 bg-slate-900/50 p-3 rounded-lg">
              <div><strong class="text-slate-300">Bentuk:</strong> ${item.attributesFound.shape}</div>
              <div><strong class="text-slate-300">Motif:</strong> ${item.attributesFound.motif}</div>
              <div><strong class="text-slate-300">Warna:</strong> ${item.attributesFound.color}</div>
            </div>
            <div>
              <h4 class="text-sm font-semibold text-amber-300 mb-1">Arti Filosofis:</h4>
              <p class="text-xs text-slate-300 leading-relaxed">${item.philosophicalMeaning}</p>
            </div>
            <div>
              <h4 class="text-sm font-semibold text-emerald-400 mb-1">Analisis Fengshui:</h4>
              <p class="text-xs text-slate-300 leading-relaxed">${item.fengShuiAnalysis}</p>
            </div>
          </div>
        `;
        grid.innerHTML += card;
      });

      document.getElementById('resultContainer').classList.remove('hidden');
    }
  </script>
</body>
</html>
