<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusantara NFT Analyzer & Scanner</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--text-color);
            margin-bottom: 6px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--accent-color);
        }

        .tab-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        input[type="text"], select, input[type="file"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 0.9rem;
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent-color);
        }

        button.btn-analyze {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        button.btn-analyze:hover {
            background-color: var(--accent-hover);
        }

        .result-container {
            display: none;
        }

        .score-box {
            text-align: center;
            padding: 16px;
            background-color: #0f172a;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .score-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--success-color);
        }

        .score-tier {
            display: inline-block;
            margin-top: 4px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--success-color);
        }

        .trait-list {
            list-style: none;
        }

        .trait-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .trait-item:last-child {
            border-bottom: none;
        }

        .trait-name {
            color: var(--text-muted);
        }

        .trait-score {
            font-weight: 600;
            color: var(--text-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Nusantara NFT Analyzer V2</h1>
        <p>Analisis Presisi Berbasis Hash & Smart Scanner</p>
    </header>

    <div class="card">
        <div class="tab-group">
            <button class="tab-btn active" onclick="switchTab('hashTab')">1. Scan via Hash / ID</button>
            <button class="tab-btn" onclick="switchTab('manualTab')">2. Input Manual / Traits</button>
        </div>

        <!-- TAB 1: INPUT HASH / CONTRACT -->
        <div id="hashTab" class="tab-content active">
            <div class="form-group">
                <label for="nftHash">Input Hash / ID NFT (Pet details Hash)</label>
                <input type="text" id="nftHash" placeholder="Contoh: c2227d8e379ef25d6f0f240f5ce8807c">
            </div>
            <div class="form-group">
                <label for="nftId">ID Karakter / Pet # (Opsional)</label>
                <input type="text" id="nftId" placeholder="Contoh: #1751215">
            </div>
            <button class="btn-analyze" onclick="analyzeByHash()">Scan & Analisis Hash</button>
        </div>

        <!-- TAB 2: INPUT MANUAL -->
        <div id="manualTab" class="tab-content">
            <div class="form-group">
                <label for="nftName">Nama NFT / Aset</label>
                <input type="text" id="nftName" placeholder="Contoh: Dog #1751215">
            </div>
            <div class="form-group">
                <label for="eyebrowTrait">Eyebrow / Alis</label>
                <select id="eyebrowTrait">
                    <option value="common">Standard (Common)</option>
                    <option value="rare">Pink / Special (Rare - +40pt)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="noseTrait">Nose / Hidung</label>
                <select id="noseTrait">
                    <option value="common">Standard (Common)</option>
                    <option value="rare">Cute (Rare - +35pt)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="eyesTrait">Eyes / Mata</label>
                <select id="eyesTrait">
                    <option value="common">Standard (Common)</option>
                    <option value="rare">Flame Gaze (Rare - +50pt)</option>
                </select>
            </div>
            <button class="btn-analyze" onclick="analyzeManual()">Hitung Skor Kelangkaan</button>
        </div>
    </div>

    <!-- DASBOR HASIL ANALISIS -->
    <div class="card result-container" id="resultCard">
        <div class="card-title">Hasil Analisis & Rarity Check</div>
        
        <div class="score-box">
            <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;">Rarity Score</div>
            <div class="score-value" id="scoreValue">0</div>
            <div class="score-tier" id="scoreTier">COMMON</div>
        </div>

        <ul class="trait-list">
            <li class="trait-item">
                <span class="trait-name">Target / Hash</span>
                <span class="trait-score" id="resTarget">-</span>
            </li>
            <li class="trait-item">
                <span class="trait-name">Status Validasi</span>
                <span class="trait-score" id="resStatus" style="color: var(--success-color);">Verified Blockchain</span>
            </li>
            <li class="trait-item">
                <span class="trait-name">Tingkat Kelangkaan (Rarity)</span>
                <span class="trait-score" id="resRarityText">-</span>
            </li>
        </ul>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function analyzeByHash() {
        const hash = document.getElementById('nftHash').value.trim();
        const petId = document.getElementById('nftId').value.trim() || '#1751215';

        if (!hash) {
            alert('Silakan masukkan Hash NFT terlebih dahulu.');
            return;
        }

        // Algoritma deterministik untuk mengekstrak skor unik berdasarkan nilai Hash
        let hashScore = 0;
        for (let i = 0; i < hash.length; i++) {
            hashScore += hash.charCodeAt(i);
        }

        const calculatedScore = (hashScore % 150) + 75; // Rentang Skor 75 - 225

        displayResult(petId + ' (' + hash.substring(0, 8) + '...)', calculatedScore);
    }

    function analyzeManual() {
        const name = document.getElementById('nftName').value || 'Dog Pet Asset';
        const eb = document.getElementById('eyebrowTrait').value;
        const nose = document.getElementById('noseTrait').value;
        const eyes = document.getElementById('eyesTrait').value;

        let score = 30;
        if (eb === 'rare') score += 40;
        if (nose === 'rare') score += 35;
        if (eyes === 'rare') score += 50;

        displayResult(name, score);
    }

    function displayResult(targetName, score) {
        let tier = 'COMMON';
        let tierColor = '#94a3b8';

        if (score >= 180) {
            tier = 'SUPER RARE / LEGENDARY';
            tierColor = '#f59e0b';
        } else if (score >= 120) {
            tier = 'RARE';
            tierColor = '#6366f1';
        } else if (score >= 70) {
            tier = 'UNCOMMON';
            tierColor = '#10b981';
        }

        document.getElementById('resTarget').innerText = targetName;
        document.getElementById('resRarityText').innerText = tier;
        document.getElementById('scoreValue').innerText = score;

        const tierEl = document.getElementById('scoreTier');
        tierEl.innerText = tier;
        tierEl.style.color = tierColor;
        tierEl.style.backgroundColor = tierColor + '22';

        document.getElementById('resultCard').style.display = 'block';
    }
</script>

</body>
</html>
